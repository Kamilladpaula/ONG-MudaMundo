<div class="main-header">
  <h1>Meu Perfil</h1>
  <p>Visualize e gerencie suas informações pessoais.</p>
</div>

<div class="user-profile-card" id="user-profile-component">
  <div class="foto-perfil-wrapper">
    <img id="profile-photo" src="../img/user-default.svg" alt="Foto de perfil">
    <label for="profile-photo-input" class="btn-upload-foto" id="btn-change-photo">📸 Alterar Foto</label>
    <input type="file" id="profile-photo-input" accept="image/*" hidden>
  </div>

  <form id="form-user-profile" class="form-perfil">
    <div class="form-group">
      <label for="profile-name">Nome Completo</label>
      <input type="text" id="profile-name" name="nome" value="{{usuario_nome}}" readonly>
    </div>

    <div class="form-group">
      <label for="profile-email">E-mail</label>
      <input type="email" id="profile-email" name="email" value="{{usuario_email}}" readonly>
    </div>

    <div class="form-group">
      <label for="profile-phone">Telefone</label>
      <input type="text" id="profile-phone" name="telefone" readonly>
    </div>

    <div class="form-group">
      <label for="profile-cep">CEP</label>
      <input type="text" id="profile-cep" name="cep" readonly>
    </div>

    <div class="form-group">
      <label for="profile-city">Cidade</label>
      <input type="text" id="profile-city" name="cidade" readonly>
    </div>

    <div class="form-group">
      <label for="profile-state">Estado</label>
      <input type="text" id="profile-state" name="estado" readonly>
    </div>

    <div class="form-group senha-wrapper" style="display: none;">
      <label for="profile-password">Nova Senha</label>
      <input type="password" id="profile-password" name="senha" minlength="8" placeholder="Deixe em branco para manter a atual">
    </div>

    <div class="botoes-perfil">
      <button type="button" id="btn-edit" class="btn-edit">✏️ Editar</button>
      <button type="submit" id="btn-save" class="btn-save" style="display:none;">💾 Salvar</button>
      <button type="button" id="btn-cancel" class="btn-cancel" style="display:none;">❌ Cancelar</button>
      </div>
  </form>
</div>
