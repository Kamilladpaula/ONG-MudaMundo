<div class="main-header">
  <h1>Dashboard</h1>

</div>

<div class="dashboard-geral">
  <div class="stat-card">
    <h3>Projetos Ativos</h3>
    <p class="stat-numero">12</p>
  </div>
  <div class="stat-card">
    <h3>Voluntários Ativos</h3>
    <p class="stat-numero">845</p>
  </div>
  <div class="stat-card">
    <h3>Arrecadação (Mês)</h3>

      <option value="todos">Todos os Meses</option>

      <option value="2">Março</option>
      <option value="3">Abril</option>
      <option value="4">Maio</option>
      <option value="5">Junho</option>
      <option value="6">Julho</option>
      <option value="7">Agosto</option>
      <option value="8">Setembro</option>
      <option value="9">Outubro</option>
      <option value="10">Novembro</option>
      <option value="11">Dezembro</option>
    </select>
    <button id="btn-exportar-csv" class="btn-secundario">Exportar CSV</button>
  </div>
  <div class="grafico-wrapper">
    <canvas id="graficoImpacto"></canvas>
  </div>
</div>
